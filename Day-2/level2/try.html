<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="StyleSheet"  href="try.css">
</head>
<body>
    <h1>Student Form</h1><br><br><br>
    <form action="get">
        <div class="container">
            <div id="name">
                NAME:
                <input type="text" placeholder="Enter your name " >
            </div><br><br>
            <div id="phone">
                PHONE:
                <input type="text" maxlength="10" minlength="10" placeholder="Enter your number">
            </div><br><br>
            <div id="gender">
                GENDER:&nbsp;&nbsp;
                <input type="checkbox">MALE:&nbsp;
                <input type="checkbox">FEMALE:
            </div><br><br>
            <div id="button">&nbsp;&nbsp;&nbsp;
                <input type="submit">&nbsp;&nbsp;
                <input type="reset">
            </div>
        </div>
    </form>
    
</body>
</html>
